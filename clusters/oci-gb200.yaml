# Cluster profile for OCI GB200 environments: storage, paths, fabric, and llm-d images.
name: oci-gb200
gpus_per_node: 4

storage:
  shared_volume:
    persistentVolumeClaim:
      claimName: lustre-pvc-vllm
  shared_mount_path: /mnt/lustre
  local_nvme_path: /mnt/numa0

logging:
  pvc: lustre-pvc-vllm
  mount_path: /mnt/lustre
  root: /mnt/lustre/{user}/logs

pod_defaults:
  shm_size: 2Gi
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/hpc-rack-2
                operator: Exists
              - key: nvidia.com/gpu.product
                operator: In
                values: ["NVIDIA-GB200"]
          # - matchExpressions:
          #     - key: node-role.kubernetes.io/hpc-rack-3
          #       operator: Exists
          #     - key: nvidia.com/gpu.product
          #       operator: In
          #       values: ["NVIDIA-GB200"]

model_server_resources:
  cpu_per_gpu: "8"
  memory_per_gpu: 128Gi

paths:
  user_root: /mnt/lustre/{user}
  cache_root: /mnt/lustre/{user}/jit-cache/{gpu_arch}/{cuda}/{cache_key}/{release}

dev:
  venv: /mnt/lustre/{user}/vllm-venv
  source: /mnt/lustre/{user}/vllm-dev

mooncake:
  master_image: "kvcacheai/mooncake:0.3.12.post1"
  protocol: "rdma"

fabric:
  ucx_net_devices: mlx5_0:1,mlx5_1:1,mlx5_3:1,mlx5_4:1
  imex_resource_claim_template: llm-d-dev-claim
  default_profile: standard
  expert_parallel_profiles:
    decode: deepep_decode
    prefill: deepep_prefill
  default_env:
    TRITON_LIBCUDA_PATH: /usr/lib64
    NVIDIA_GDRCOPY: enabled
    UCX_NET_DEVICES: "{ucx_net_devices}"
    VLLM_ENGINE_READY_TIMEOUT_S: "1800"
  profiles:
    standard: {}
    deepep_decode:
      requires_imex: true
      env:
        VLLM_USE_NCCL_SYMM_MEM: "1"
        NCCL_CUMEM_ENABLE: "1"
        NCCL_MNNVL_ENABLE: "1"
        NVSHMEM_DISABLE_CUDA_VMM: "0"
        NCCL_NVLS_ENABLE: "1"
        NVSHMEM_CUMEM_HANDLE_TYPE: FABRIC
        VLLM_DEEPEP_LOW_LATENCY_USE_MNNVL: "1"
        VLLM_DEEPEP_BUFFER_SIZE_MB: "0"
      computed_env:
        NVSHMEM_QP_DEPTH: max_concurrency * 2 + 2
    deepep_prefill:
      requires_imex: true
      env:
        VLLM_USE_NCCL_SYMM_MEM: "1"
        NCCL_CUMEM_ENABLE: "1"
        NCCL_MNNVL_ENABLE: "1"
        NVSHMEM_DISABLE_CUDA_VMM: "0"
        NCCL_NVLS_ENABLE: "0"
        VLLM_DEEPEP_HIGH_THROUGHPUT_FORCE_INTRA_NODE: "1"
        VLLM_USE_DEEP_GEMM: "1"
    # For InferenceX's deep_gemm_mega_moe backend: no DeepEP all2all dispatch, but
    # MegaMoE's combine step and cross-node allreduce still ride NCCL symmetric
    # memory over multi-node NVLink, so it needs the same IMEX channel access as
    # the deepep_* profiles. -ix model specs opt in with `fabric_profile: megamoe`.
    megamoe:
      requires_imex: true
      env:
        NCCL_CUMEM_ENABLE: "1"
        NCCL_MNNVL_ENABLE: "1"
        NCCL_NVLS_ENABLE: "1"
        TORCH_SYMMMEM: NVSHMEM
        UCX_MEMTYPE_CACHE: "n"
