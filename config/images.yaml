llm_d:
  # v0.10.0: picks up BindLiveness (llm-d/llm-d-router#2313) -- the
  # inflight-load-producer's PluginState entries are no longer reaped by the
  # 5-minute janitor TTL while the request's own ext_proc stream is still
  # alive, fixing the false "idle" load signal on deeply-queued prefill ranks
  # (confirmed root cause of the v10 rank7 pileup). Verified the plugins we
  # actually use (prefix-cache-affinity-filter, prefix-cache-scorer,
  # token-load-scorer, active-request-scorer, approx-prefix-cache-producer,
  # inflight-load-producer, disagg-profile-handler/disagg-headers-handler,
  # max-score-picker) only gained additive/backward-compatible config between
  # v0.9.0 and v0.10.0. Not yet audited: routing_sidecar's own v0.9.0->v0.10.0
  # diff (34 files) -- watch the P->D NIXL transfer path after this bump.
  release: v0.10.0
  epp: ghcr.io/vmaroon/llmd-router-epp@sha256:e8e0529166213e642a3fe4af7e8de4c4fe1e2c943227a1ce4899d941aa7e3fcd
  routing_sidecar: ghcr.io/llm-d/llm-d-router-disagg-sidecar:{release}

sidecars:
