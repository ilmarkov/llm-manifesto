# MTP variant of 3P-EP8-1D-EP16: disagg-gb200-3p1d-dep8-dep16-agentic
# 10 nodes / 40 GPUs. MTP with 3 speculative tokens.
extends: ix-disagg-base.yaml
release: ix-3p-ep8-1d-ep16-mtp

roles:
  prefill:
    lws: {replicas: 3}
    vllm:
      max_num_seqs: 214
  decode:
    vllm:
      max_num_seqs: 160
      max_num_batched_tokens: 640
      max_cudagraph_capture_size: 160
