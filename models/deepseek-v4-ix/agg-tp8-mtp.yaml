# DeepSeek-V4-Pro with MTP speculative decoding.
# 2 nodes / 8 GPUs (TP8). MTP with 3 speculative tokens.
extends: ix-agg-base.yaml
release: ix-agg-tp8-mtp-v3-long

roles:
  decode:
    vllm:
      gpu_memory_utilization: "0.9"
      max_cudagraph_capture_size: 64
      speculative_config:
        method: mtp
        num_speculative_tokens: 2
        draft_sample_method: probabilistic
