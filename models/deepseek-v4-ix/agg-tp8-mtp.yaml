# MTP variant of agg-tp8: agg-gb200-tp8-agentic
# 2 nodes / 8 GPUs (TP8). MTP with 3 speculative tokens.
extends: ix-agg-base.yaml
release: ix-agg-tp8-mtp

roles:
  decode:
    vllm:
      compilation_config:
        cudagraph_mode: FULL_DECODE_ONLY
        cudagraph_capture_sizes: [4, 8, 12, 16, 20, 24, 28, 32]
        mode: 0
