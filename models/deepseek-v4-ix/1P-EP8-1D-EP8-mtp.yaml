# MTP variant of 1P-EP8-1D-EP8: disagg-gb200-1p1d-dep8-dep8-agentic
# 4 nodes / 16 GPUs. MTP with 3 speculative tokens.
extends: ix-disagg-base.yaml
release: ix-1p-ep8-1d-ep8-mtp

roles:
  prefill:
    lws: {replicas: 1}
    vllm:
      max_num_seqs: 128
  decode:
    workload_name: vllm-ep8-decode
    lws: {size: 2}
    parallelism: {tp: 1, dp: 8, ep: true}
    vllm:
      max_num_seqs: 64
      max_num_batched_tokens: 256
      max_cudagraph_capture_size: 64
