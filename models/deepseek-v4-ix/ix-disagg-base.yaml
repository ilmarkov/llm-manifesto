# InferenceX PR #2260 disagg base — GB200 AgentX Dynamo-vLLM tuning for Kubernetes.
# Slurm/Dynamo/benchmark harness settings are omitted; see models/deepseek-v4/inferencex-pr2260-diff.md.
topology: pd

mooncake:
  enabled: true
  # 38GB->70GB 2026-08-22: reverting the CPU-offload-favoring split. Empirically,
  # 120GB-CPU-offload/38GB-mooncake crashed the node (chronic kernel OOM) even
  # after trimming the pod memory limit, while 120GB-mooncake/38GB-CPU-offload
  # (the original split) ran for hours without issue -- same nominal combined
  # total either way. Root cause: SimpleCPUOffloadConnector's buffer is
  # torch.zeros(...) (eagerly faults in every page at startup, no lazy
  # commitment) then cudaHostRegister-pinned (vllm/v1/simple_kv_offload/
  # worker.py) -- pinned pages are permanently excluded from all kernel
  # reclaim paths. Mooncake's global segment explicitly logs "Store segment
  # pinned memory is disabled" -- it's NUMA-bound anonymous memory the kernel
  # can still reclaim/compact under pressure. So a GB in CPU-offload is a much
  # "harder" claim on physical RAM than a GB in Mooncake. This tunes the split
  # to 80GB CPU-offload / 70GB mooncake (150GiB/rank total, slightly below the
  # old 158GiB/rank) to shrink the permanently-pinned portion (was 120GB/rank)
  # while still giving the router-visible CPU-offload tier a meaningful size.
  global_segment_size: "120GB"
  local_buffer_size: "4GB"

model:
  id: deepseek-ai/DeepSeek-V4-Pro
  label: DeepSeek-V4-Pro-IX
  # image_ref: vllm.ix
  # image_ref: vllm.standard
  # image_ref: vllm.pinned_nightly_2026-08-07
  # image_ref: vllm.pinned_nightly_2026-08-14
  image_ref: vllm.pinned_nightly_2026-08-14-fix-v1
  # image_ref: vllm.fixed_nightly
  # image_ref: vllm.nightly_2026-08-12
  served_name: deepseek-ai/DeepSeek-V4-Pro

routing: {kind: pd, target_role: decode}
runtime: {sidecars: [dcgm-exporter, node-exporter]}

roles:
  - name: decode
    workload_name: vllm-ep16-decode
    lws: {size: 4, replicas: 1}
    parallelism: {tp: 1, dp: 16, ep: true}
    fabric_profile: megamoe
    kv_transfer_config:
      kv_connector: NixlConnector
      kv_role: kv_both
      kv_load_failure_policy: fail
      kv_buffer_device: cuda
      # kv_connector_extra_config:
      #   enforce_handshake_compat: false
    env:
      PYTHONHASHSEED: "0"
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
      VLLM_USE_V2_MODEL_RUNNER: "1"
      VLLM_USE_RUST_FRONTEND: "1"
      VLLM_SERVER_DEV_MODE: "1"
      VLLM_USE_NCCL_SYMM_MEM: "1"
      VLLM_ENGINE_READY_TIMEOUT_S: "3600"
      VLLM_RPC_TIMEOUT: "600000"
      VLLM_LOG_STATS_INTERVAL: "1"
      VLLM_MOONCAKE_LOAD_RECV_THREADS: "20"
      VLLM_DSV4_MEGA_FP8_COMBINE: "1"
      TILELANG_CLEANUP_TEMP_FILES: "1"
      DG_JIT_CACHE_DIR: /tmp/dg-cache-dsv4-agentx
      UCX_TLS: rc,cuda_copy
      VLLM_RANDOMIZE_DP_DUMMY_INPUTS: "1"
      VLLM_PREFIX_CACHE_RETENTION_INTERVAL: "32768"
      VLLM_USE_DEEP_GEMM: "1"
      # VLLM_V2_WARMUP_MAX_NUM_SEQS: "32"  # Not recognized by current vLLM; awaiting shared JIT warmup infra (vllm PR #47451)
      MC_ENABLE_DEST_DEVICE_AFFINITY: "1"
    resources:
      ephemeral_storage: 128Gi
    vllm:
      load_format: auto
      trust_remote_code: true
      # not useful
      # enable_prompt_tokens_details: true
      moe_backend: deep_gemm_mega_moe
      # all2all_backend: deepep_v2
      gpu_memory_utilization: "0.95"
      kv_cache_metrics: true
      kv_cache_metrics_sample: 0.25
      kv_cache_dtype: fp8
      block_size: 256
      enable_cumem_allocator: true
      enable_ep_weight_filter: true
      numa_bind: true
      no_disable_hybrid_kv_cache_manager: true
      no_enable_flashinfer_autotune: true
      tokenizer_mode: deepseek_v4
      max_model_len: 1048576
      max_num_batched_tokens: 256
      attention_config:
        backend: FLASHINFER_MLA_SPARSE_DSV4
        use_prefill_query_quantization: true
        use_fp4_indexer_cache: true
      compilation_config: {cudagraph_mode: FULL_DECODE_ONLY, mode: 0}

  - name: prefill
    workload_name: vllm-ep8-prefill
    lws: {size: 2, replicas: 1}
    parallelism: {tp: 1, dp: 8, ep: true}
    fabric_profile: megamoe
    dp_load_balancing: external
    # Enables vLLM's native KV-block store/remove event stream over ZMQ,
    # consumed by the EPP's precise-prefix-cache-producer instead of the
    # capacity-guessing approx producer. Decode has no prefix-cache-affinity-
    # filter/prefix-cache-scorer in its profile, so it doesn't need this.
    kv_events_config: {port: 5557}
    kv_transfer_config:
      kv_connector: MultiConnector
      kv_role: kv_both
      kv_connector_extra_config:
        connectors:
          - kv_connector: NixlConnector
            kv_role: kv_both
            kv_load_failure_policy: fail
            kv_buffer_device: cuda
            # kv_connector_extra_config:
            #   enforce_handshake_compat: false
          - kv_connector: SimpleCPUOffloadConnector
            kv_role: kv_both
            kv_connector_extra_config:
              # 120GB->80GB 2026-08-22: see mooncake.global_segment_size above
              # for the full rationale -- CPU-offload's buffer is eagerly
              # committed + cudaHostRegister-pinned (permanently unreclaimable
              # RAM), unlike Mooncake's explicitly-unpinned segment, so it was
              # the wrong tier to favor with the larger share. 80GB/rank here,
              # paired with mooncake 70GB/rank, for a 150GiB/rank combined
              # total (down from 158GiB/rank) and a smaller pinned-memory
              # footprint (320GB/pod pinned vs. 480GB/pod before).
              cpu_bytes_to_use: 42949672960
          - kv_connector: MooncakeStoreConnector
            kv_role: kv_both
            kv_connector_extra_config:
              load_async: true
              lookup_async: true
              enable_cross_layers_blocks: false
              enable_offload: false
    env:
      PYTHONHASHSEED: "0"
      VLLM_USE_V2_MODEL_RUNNER: "1"
      VLLM_USE_RUST_FRONTEND: "1"
      VLLM_SERVER_DEV_MODE: "1"
      VLLM_USE_NCCL_SYMM_MEM: "1"
      VLLM_ENGINE_READY_TIMEOUT_S: "3600"
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
      VLLM_RPC_TIMEOUT: "600000"
      VLLM_LOG_STATS_INTERVAL: "1"
      # VLLM_V2_WARMUP_MAX_NUM_SEQS: "32"  # Not recognized by current vLLM; awaiting shared JIT warmup infra (vllm PR #47451)
      VLLM_MOONCAKE_LOAD_RECV_THREADS: "20"
      # Mooncake's own client-side RPC I/O pools (read directly by the C++
      # client at process init, not through vLLM's envs.py -- see Mooncake's
      # deployment guide "Engine Runtime Tuning (MC_*)"). Default is
      # min(16, CPU cores); doubled here as a preventative margin now that
      # global_segment_size is 70GB/rank (2026-08-22) -- live save_put/
      # save_exists latency (p99 4.9ms/48.9ms) showed the single Python send
      # thread at only ~3.8% duty cycle before this change, so this isn't
      # fixing a proven bottleneck, just giving headroom for the higher save
      # volume the larger pool may drive. Isolated pools: STORE covers
      # put/get/lookup RPCs to the master, TE covers the actual RDMA data
      # movement (used by both puts and gets).
      MC_STORE_RPC_CLIENT_IO_THREADS: "32"
      MC_TE_RPC_CLIENT_IO_THREADS: "32"
      VLLM_CONNECTOR_PREFETCH_DEPTH: "8"
      VLLM_CONNECTOR_PREFETCH_KV_CAP: "0.65"
      VLLM_DSV4_MEGA_FP8_COMBINE: "1"
      TILELANG_CLEANUP_TEMP_FILES: "1"
      VLLM_HTTP_TIMEOUT_KEEP_ALIVE: "120"
      DG_JIT_CACHE_DIR: /tmp/dg-cache-dsv4-agentx
      UCX_TLS: rc,cuda_copy
      VLLM_RANDOMIZE_DP_DUMMY_INPUTS: "1"
      VLLM_PREFIX_CACHE_RETENTION_INTERVAL: "32768"
      VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
      MC_ENABLE_DEST_DEVICE_AFFINITY: "1"
      VLLM_USE_DEEP_GEMM: "1"
    resources:
      ephemeral_storage: 128Gi
      # 920Gi->880Gi 2026-08-22: at 920Gi we hit recurring node-level kernel
      # OOM kills (kubectl describe node showed ~95 SystemOOM events in 38
      # minutes, mostly killing unrelated node daemons like compute-domain-),
      # which cascaded into LeaderWorkerSet's RecreateGroupOnPodRestart
      # tearing down the whole prefill group every ~3.5 minutes. Root cause:
      # the GB200 node's Allocatable (~957.2GiB) is essentially equal to its
      # Capacity -- kubelet carves out no kube-reserved/system-reserved
      # headroom -- so 920Gi (96.2% of allocatable) left only ~37GiB for the
      # OS, container runtime, Cilium, sidecars (dcgm/node-exporter), and the
      # NVSwitch fabric daemon, which wasn't enough in practice even though
      # our own container's cgroup usage never approached 920Gi (observed
      # ~450-490GiB at crash time). 880Gi restores ~77GiB of real headroom;
      # combined with the tier rebalance below (150GiB/rank, less pinned
      # memory), this leaves meaningfully more slack than before.
      memory: 880Gi
    vllm:
      load_format: auto
      trust_remote_code: true
      # not useful
      # enable_prompt_tokens_details: true
      moe_backend: deep_gemm_mega_moe
      gpu_memory_utilization: "0.97"
      kv_cache_metrics: true
      kv_cache_metrics_sample: 0.25
      kv_cache_dtype: fp8
      block_size: 256
      enable_cumem_allocator: true
      enable_ep_weight_filter: true
      numa_bind: true
      no_disable_hybrid_kv_cache_manager: true
      no_enable_flashinfer_autotune: true
      tokenizer_mode: deepseek_v4
      max_model_len: 1048576
      max_num_batched_tokens: 8192
      long_prefill_token_threshold: 1024
      attention_config:
        backend: FLASHINFER_MLA_SPARSE_DSV4
        use_prefill_query_quantization: true
        use_fp4_indexer_cache: true
