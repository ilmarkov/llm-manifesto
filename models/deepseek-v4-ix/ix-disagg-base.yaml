# InferenceX PR #2260 disagg base — GB200 AgentX Dynamo-vLLM tuning for Kubernetes.
# Slurm/Dynamo/benchmark harness settings are omitted; see models/deepseek-v4/inferencex-pr2260-diff.md.
topology: pd

mooncake:
  enabled: true
  # 80GB->120GB 2026-08-21: master admin metrics showed the pool sitting at
  # 88.4% of its 640GB aggregate (8 ranks x 80GB) and climbing toward the
  # eviction_high_watermark_ratio=0.9 trigger, having already evicted 2.06TB
  # (3.2x its own capacity) since deployment start. +40GB/rank -> 960GB
  # aggregate. Paired with prefill resources.memory 768Gi->920Gi below and
  # cpu_bytes_to_use 40GB->38GB/rank in the prefill role's
  # SimpleCPUOffloadConnector config, to keep combined tier footprint
  # (158GiB/rank) within the new node headroom (~37GiB/pod left on a
  # 956.8GiB GB200 node at the new 920Gi container limit).
  global_segment_size: "160GB"
  local_buffer_size: "4GB"
  # standalone-store 2026-08-25: moves the 160GB/rank pool contribution out of
  # the vLLM process and into a mooncake_client sidecar (see lws.py) that's
  # colocated in the same pod, reached over 127.0.0.1. Unlike embedded mode,
  # this is Mooncake's officially-supported path for a real SSD tier (Method
  # C, "resource-owning real client") -- embedded mode's enable_offload only
  # catches puts that happen to land on a single designated owner segment.
  # Aggregate memory footprint is unchanged (still 8 x 160GB); see prefill
  # role's resources.memory below for where that 160GB/rank now lives instead.
  mode: standalone-store
  enable_offload: true
  # Lazy SSD writes (only on eviction, not eagerly after every Put) to limit
  # SSD write amplification on the shared local NVMe.
  offload_on_evict: true
  # Let hot SSD-only objects get promoted back to DRAM on repeated reads,
  # using the master's default --promotion_admission_threshold=2.
  promotion_on_hit: true
  # Per-client (per mooncake_client sidecar) disk cap, well under the
  # 14TB local NVMe RAID (/mnt/local) shared with other pod workloads.
  quota_bytes: 4000000000000

model:
  id: deepseek-ai/DeepSeek-V4-Pro
  label: DeepSeek-V4-Pro-IX
  # image_ref: vllm.ix
  # image_ref: vllm.standard
  # image_ref: vllm.pinned_nightly_2026-08-07
  # image_ref: vllm.pinned_nightly_2026-08-14
  # image_ref: vllm.pinned_nightly_2026-08-14-fix
  image_ref: vllm.pinned_nightly_2026-08-19-fix
  # image_ref: vllm.fixed_nightly
  # image_ref: vllm.nightly_2026-08-12
  served_name: deepseek-ai/DeepSeek-V4-Pro

routing: {kind: pd, target_role: decode}
runtime: {sidecars: [dcgm-exporter, node-exporter]}

roles:
  - name: decode
    workload_name: vllm-ep16-decode
    lws: {size: 4, replicas: 1}
    parallelism: {tp: 1, dp: 16, ep: true}
    fabric_profile: megamoe
    kv_transfer_config:
      kv_connector: NixlConnector
      kv_role: kv_both
      kv_load_failure_policy: fail
      kv_buffer_device: cuda
      # kv_connector_extra_config:
      #   enforce_handshake_compat: false
    env:
      PYTHONHASHSEED: "0"
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
      VLLM_USE_V2_MODEL_RUNNER: "1"
      VLLM_USE_RUST_FRONTEND: "1"
      VLLM_SERVER_DEV_MODE: "1"
      VLLM_USE_NCCL_SYMM_MEM: "1"
      VLLM_ENGINE_READY_TIMEOUT_S: "3600"
      VLLM_RPC_TIMEOUT: "600000"
      VLLM_LOG_STATS_INTERVAL: "1"
      VLLM_MOONCAKE_LOAD_RECV_THREADS: "20"
      VLLM_DSV4_MEGA_FP8_COMBINE: "1"
      TILELANG_CLEANUP_TEMP_FILES: "1"
      DG_JIT_CACHE_DIR: /tmp/dg-cache-dsv4-agentx
      UCX_TLS: rc,cuda_copy
      VLLM_RANDOMIZE_DP_DUMMY_INPUTS: "1"
      VLLM_PREFIX_CACHE_RETENTION_INTERVAL: "32768"
      VLLM_USE_DEEP_GEMM: "1"
      VLLM_CONNECTOR_PREFETCH_DEPTH: "8"
      # VLLM_V2_WARMUP_MAX_NUM_SEQS: "32"  # Not recognized by current vLLM; awaiting shared JIT warmup infra (vllm PR #47451)
      MC_ENABLE_DEST_DEVICE_AFFINITY: "1"
    resources:
      ephemeral_storage: 128Gi
    vllm:
      load_format: auto
      trust_remote_code: true
      # not useful
      # enable_prompt_tokens_details: true
      moe_backend: deep_gemm_mega_moe
      # all2all_backend: deepep_v2
      gpu_memory_utilization: "0.95"
      kv_cache_metrics: true
      kv_cache_metrics_sample: 0.25
      kv_cache_dtype: fp8
      block_size: 256
      enable_cumem_allocator: true
      enable_ep_weight_filter: true
      numa_bind: true
      no_disable_hybrid_kv_cache_manager: true
      no_enable_flashinfer_autotune: true
      tokenizer_mode: deepseek_v4
      max_model_len: 1048576
      max_num_batched_tokens: 256
      attention_config:
        backend: FLASHINFER_MLA_SPARSE_DSV4
        use_prefill_query_quantization: true
        use_fp4_indexer_cache: true
      compilation_config: {cudagraph_mode: FULL_DECODE_ONLY, mode: 0}

  - name: prefill
    workload_name: vllm-ep8-prefill
    lws: {size: 2, replicas: 1}
    parallelism: {tp: 1, dp: 8, ep: true}
    fabric_profile: megamoe
    dp_load_balancing: external
    kv_transfer_config:
      kv_connector: MultiConnector
      kv_role: kv_both
      kv_connector_extra_config:
        connectors:
          - kv_connector: NixlConnector
            kv_role: kv_both
            kv_load_failure_policy: fail
            kv_buffer_device: cuda
            # kv_connector_extra_config:
            #   enforce_handshake_compat: false
          # - kv_connector: SimpleCPUOffloadConnector
          #   kv_role: kv_both
          #   kv_connector_extra_config:
          #     # 40GB->38GB/rank 2026-08-21, paired with mooncake 80GB->120GB/rank
          #     # above: kept combined tier footprint at 158GiB/rank (same total as
          #     # originally planned 108+50 split) while shifting more of the
          #     # increase to mooncake, since it's the tier with confirmed eviction
          #     # pressure (master admin metrics: 88.4% full, 2.06TB already
          #     # evicted); CPU-offload has no eviction telemetry of its own to
          #     # confirm the same pressure. See resources.memory below and
          #     # mooncake.global_segment_size above for the full accounting.
          #     cpu_bytes_to_use: 40802189312
          - kv_connector: MooncakeStoreConnector
            kv_role: kv_both
            kv_connector_extra_config:
              load_async: true
              lookup_async: true
              enable_cross_layers_blocks: false
              # Real toggle lives in mooncake.enable_offload above (rendered
              # into mooncake_config.json, which is what vLLM's
              # MooncakeStoreConfig.from_file() actually reads). vLLM's
              # MooncakeStoreConnector does not read an `enable_offload` key
              # out of kv_connector_extra_config at all -- a stale `false`
              # was left here previously despite mooncake.enable_offload
              # being the real, effective setting; removed to avoid the two
              # looking contradictory.
    env:
      PYTHONHASHSEED: "0"
      VLLM_USE_V2_MODEL_RUNNER: "1"
      VLLM_USE_RUST_FRONTEND: "1"
      VLLM_SERVER_DEV_MODE: "1"
      VLLM_USE_NCCL_SYMM_MEM: "1"
      VLLM_ENGINE_READY_TIMEOUT_S: "3600"
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
      VLLM_RPC_TIMEOUT: "600000"
      VLLM_LOG_STATS_INTERVAL: "1"
      # VLLM_V2_WARMUP_MAX_NUM_SEQS: "32"  # Not recognized by current vLLM; awaiting shared JIT warmup infra (vllm PR #47451)
      VLLM_MOONCAKE_LOAD_RECV_THREADS: "20"
      # Mooncake's own client-side RPC I/O pools (read directly by the C++
      # client at process init, not through vLLM's envs.py -- see Mooncake's
      # deployment guide "Engine Runtime Tuning (MC_*)"). Default is
      # min(16, CPU cores); doubled here as a preventative margin now that
      # global_segment_size is 120GB/rank (2026-08-21) -- live save_put/
      # save_exists latency (p99 4.9ms/48.9ms) showed the single Python send
      # thread at only ~3.8% duty cycle before this change, so this isn't
      # fixing a proven bottleneck, just giving headroom for the higher save
      # volume the larger pool may drive. Isolated pools: STORE covers
      # put/get/lookup RPCs to the master, TE covers the actual RDMA data
      # movement (used by both puts and gets).
      MC_STORE_RPC_CLIENT_IO_THREADS: "32"
      MC_TE_RPC_CLIENT_IO_THREADS: "32"
      VLLM_CONNECTOR_PREFETCH_DEPTH: "8"
      VLLM_CONNECTOR_PREFETCH_KV_CAP: "0.65"
      VLLM_DSV4_MEGA_FP8_COMBINE: "1"
      TILELANG_CLEANUP_TEMP_FILES: "1"
      VLLM_HTTP_TIMEOUT_KEEP_ALIVE: "120"
      DG_JIT_CACHE_DIR: /tmp/dg-cache-dsv4-agentx
      UCX_TLS: rc,cuda_copy
      VLLM_RANDOMIZE_DP_DUMMY_INPUTS: "1"
      VLLM_PREFIX_CACHE_RETENTION_INTERVAL: "32768"
      VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
      MC_ENABLE_DEST_DEVICE_AFFINITY: "1"
      VLLM_USE_DEEP_GEMM: "1"
    resources:
      ephemeral_storage: 128Gi
      # 920Gi->323Gi 2026-08-25: mooncake standalone-store (see mooncake.mode
      # above) moves the mooncake pool contribution out of this container and
      # into the new mooncake-client sidecar. This pod runs 4 local DP ranks
      # (dp=8 / lws.size=2), and each one used to independently register its
      # own 160GB segment in embedded mode -- i.e. this container was holding
      # 4 x 160GB (~597GiB, ceil), not just one rank's worth. One shared
      # sidecar now covers all 4 (see lws.py's _mooncake_client_container),
      # sized to ~605Gi (597Gi + 8Gi overhead, _mooncake_client_memory_limit).
      # GB200 node has 956.8GiB allocatable (4 DP ranks/pod = 1 pod/node):
      # 323 (vllm) + 605 (mooncake-client) + ~0.56 (dcgm/node-exporter) =
      # ~928.6GiB, leaving ~28GiB headroom for kubelet/system reserve and
      # transient spikes -- comparable to the previous ~37GiB. Watch actual
      # steady-state usage on first deploy and adjust if headroom is tight.
      memory: 323Gi
    vllm:
      load_format: auto
      trust_remote_code: true
      # not useful
      # enable_prompt_tokens_details: true
      moe_backend: deep_gemm_mega_moe
      gpu_memory_utilization: "0.97"
      kv_cache_metrics: true
      kv_cache_metrics_sample: 0.25
      kv_cache_dtype: fp8
      block_size: 256
      enable_cumem_allocator: true
      enable_ep_weight_filter: true
      numa_bind: true
      no_disable_hybrid_kv_cache_manager: true
      no_enable_flashinfer_autotune: true
      tokenizer_mode: deepseek_v4
      max_model_len: 1048576
      max_num_batched_tokens: 8192
      long_prefill_token_threshold: 1024
      attention_config:
        backend: FLASHINFER_MLA_SPARSE_DSV4
        use_prefill_query_quantization: true
        use_fp4_indexer_cache: true
