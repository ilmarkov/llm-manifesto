# InferenceX PR #2260 disagg base — GB200 AgentX Dynamo-vLLM tuning for Kubernetes.
# Slurm/Dynamo/benchmark harness settings are omitted; see models/deepseek-v4/inferencex-pr2260-diff.md.
topology: pd

model:
  id: deepseek-ai/DeepSeek-V4-Pro
  label: DeepSeek-V4-Pro-IX
  # image_ref: vllm.ix
  image_ref: vllm.standard
  served_name: deepseek-ai/DeepSeek-V4-Pro

routing: {kind: pd, target_role: decode}
runtime: {sidecars: [dcgm-exporter, node-exporter]}

roles:
  - name: decode
    workload_name: vllm-ep16-decode
    lws: {size: 4, replicas: 1}
    parallelism: {tp: 1, dp: 16, ep: true}
    fabric_profile: megamoe
    kv_transfer_config:
      kv_connector: NixlConnector
      kv_role: kv_both
      kv_buffer_device: cuda
      kv_load_failure_policy: fail
    # Mooncake disabled until store config + master are wired for Kubernetes.
    # kv_connector: MultiConnector
    # kv_role: kv_both
    # kv_connector_extra_config:
    #   connectors:
    #     - kv_connector: NixlConnector
    #       kv_role: kv_both
    #       kv_load_failure_policy: fail
    #       kv_buffer_device: cuda
    #       kv_connector_extra_config:
    #         enforce_handshake_compat: false
    #         enable_cross_layers_blocks: false
    #     - kv_connector: MooncakeStoreConnector
    #       kv_role: kv_both
    #       kv_connector_extra_config:
    #         load_async: true
    #         lookup_async: true
    #         enable_cross_layers_blocks: false
    #         enable_offload: false
    env:
      VLLM_USE_V2_MODEL_RUNNER: "1"
      VLLM_SERVER_DEV_MODE: "1"
      VLLM_USE_NCCL_SYMM_MEM: "1"
      VLLM_ENGINE_READY_TIMEOUT_S: "3600"
      VLLM_RPC_TIMEOUT: "600000"
      VLLM_LOG_STATS_INTERVAL: "1"
      VLLM_V2_WARMUP_MAX_NUM_SEQS: "20"
      # VLLM_MOONCAKE_LOAD_RECV_THREADS: "20"
      VLLM_DSV4_MEGA_FP8_COMBINE: "1"
      VLLM_ALLREDUCE_USE_SYMM_MEM: "0"
      TILELANG_CLEANUP_TEMP_FILES: "1"
      DG_JIT_CACHE_DIR: /tmp/dg-cache-dsv4-agentx
      UCX_TLS: rc,cuda_copy
      VLLM_RANDOMIZE_DP_DUMMY_INPUTS: "1"
      VLLM_PREFIX_CACHE_RETENTION_INTERVAL: "32768"
      # MC_ENABLE_DEST_DEVICE_AFFINITY: "1"
    resources:
      ephemeral_storage: 128Gi
    vllm:
      load_format: auto
      trust_remote_code: true
      moe_backend: deep_gemm_mega_moe
      gpu_memory_utilization: "0.95"
      kv_cache_dtype: fp8
      block_size: 256
      enable_cumem_allocator: true
      enable_ep_weight_filter: true
      numa_bind: true
      no_disable_hybrid_kv_cache_manager: true
      no_enable_flashinfer_autotune: true
      tokenizer_mode: deepseek_v4
      max_model_len: 1048576
      max_num_batched_tokens: 256
      attention_config:
        backend: FLASHINFER_MLA_SPARSE_DSV4
        use_prefill_query_quantization: true
        use_fp4_indexer_cache: true
      compilation_config: {cudagraph_mode: FULL_DECODE_ONLY, mode: 0}

  - name: prefill
    workload_name: vllm-ep8-prefill
    lws: {size: 2, replicas: 1}
    parallelism: {tp: 1, dp: 8, ep: true}
    fabric_profile: megamoe
    dp_load_balancing: external
    kv_transfer_config:
      kv_connector: NixlConnector
      kv_role: kv_both
      kv_buffer_device: cuda
      kv_load_failure_policy: fail
    # Mooncake disabled until store config + master are wired for Kubernetes.
    # kv_connector: MultiConnector
    # kv_role: kv_both
    # kv_connector_extra_config:
    #   connectors:
    #     - kv_connector: NixlConnector
    #       kv_role: kv_both
    #       kv_load_failure_policy: fail
    #       kv_buffer_device: cuda
    #       kv_connector_extra_config:
    #         enforce_handshake_compat: false
    #         enable_cross_layers_blocks: false
    #     - kv_connector: MooncakeStoreConnector
    #       kv_role: kv_both
    #       kv_connector_extra_config:
    #         load_async: true
    #         lookup_async: true
    #         enable_cross_layers_blocks: false
    #         enable_offload: false
    env:
      VLLM_USE_V2_MODEL_RUNNER: "1"
      VLLM_SERVER_DEV_MODE: "1"
      VLLM_USE_NCCL_SYMM_MEM: "1"
      VLLM_ENGINE_READY_TIMEOUT_S: "3600"
      VLLM_RPC_TIMEOUT: "600000"
      VLLM_LOG_STATS_INTERVAL: "1"
      VLLM_V2_WARMUP_MAX_NUM_SEQS: "20"
      # VLLM_MOONCAKE_LOAD_RECV_THREADS: "20"
      # VLLM_CONNECTOR_PREFETCH_DEPTH: "8"
      # VLLM_CONNECTOR_PREFETCH_KV_CAP: "0.65"
      VLLM_DSV4_MEGA_FP8_COMBINE: "1"
      VLLM_ALLREDUCE_USE_SYMM_MEM: "0"
      TILELANG_CLEANUP_TEMP_FILES: "1"
      DG_JIT_CACHE_DIR: /tmp/dg-cache-dsv4-agentx
      UCX_TLS: rc,cuda_copy
      VLLM_RANDOMIZE_DP_DUMMY_INPUTS: "1"
      VLLM_PREFIX_CACHE_RETENTION_INTERVAL: "32768"
      VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
      # MC_ENABLE_DEST_DEVICE_AFFINITY: "1"
    resources:
      ephemeral_storage: 128Gi
    vllm:
      load_format: auto
      trust_remote_code: true
      moe_backend: deep_gemm_mega_moe
      gpu_memory_utilization: "0.9"
      kv_cache_dtype: fp8
      block_size: 256
      enable_cumem_allocator: true
      enable_ep_weight_filter: true
      numa_bind: true
      no_disable_hybrid_kv_cache_manager: true
      no_enable_flashinfer_autotune: true
      tokenizer_mode: deepseek_v4
      max_model_len: 1048576
      max_num_batched_tokens: 8192
      attention_config:
        backend: FLASHINFER_MLA_SPARSE_DSV4
        use_prefill_query_quantization: true
        use_fp4_indexer_cache: true
