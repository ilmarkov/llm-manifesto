# InferenceX: disagg-gb200-1p1d-dep8-dep12-agentic / dsv4-fp4-gb200-dynamo-vllm-agentic-1p1d-dep8-dep12
# 5 nodes / 20 GPUs. Benchmark conc-list: 384, 512
extends: ix-disagg-base.yaml
release: ix-1p-ep8-1d-ep12

roles:
  prefill:
    lws: {replicas: 1}
    vllm:
      max_num_seqs: 128
  decode:
    workload_name: vllm-ep12-decode
    lws: {size: 3}
    parallelism: {tp: 1, dp: 12, ep: true}
    vllm:
      max_num_seqs: 128
      max_cudagraph_capture_size: 128
