# MTP variant of 1P-EP8-1D-EP12: disagg-gb200-1p1d-dep8-dep12-agentic
# 5 nodes / 20 GPUs. MTP with 3 speculative tokens.
extends: ix-disagg-base.yaml
release: ix-1p-ep8-1d-ep12-mtp

roles:
  prefill:
    lws: {replicas: 1}
    vllm:
      max_num_seqs: 256
  decode:
    workload_name: vllm-ep12-decode
    lws: {size: 3}
    parallelism: {tp: 1, dp: 12, ep: true}
    vllm:
      max_num_seqs: 128
      max_num_batched_tokens: 512
      max_cudagraph_capture_size: 128
