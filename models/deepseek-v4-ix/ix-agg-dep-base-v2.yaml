# Aggregated DEP base v2 — DP attention + EP MLP on GB200.
# Based on ix-agg-dep-base.yaml + InferenceX PR #2260 changes (excluding mooncake).
# Each DP rank handles attention for its own sequences; MoE layers are
# expert-parallel across all ranks. Requires DP-aware routing (EPP v0.9.0+).
topology: aggregated

model:
  id: deepseek-ai/DeepSeek-V4-Pro
  label: DeepSeek-V4-Pro-IX
  image_ref: vllm.ix
  served_name: deepseek-ai/DeepSeek-V4-Pro

routing: {kind: load_aware, target_role: decode}
runtime: {sidecars: [dcgm-exporter, node-exporter]}

roles:
  - name: decode
    workload_name: vllm-dep8-agg-v2
    lws: {size: 2, replicas: 1}
    parallelism: {tp: 1, dp: 8, ep: true}
    fabric_profile: megamoe
    # cpu_bytes_to_use_per_rank = per_node_dram × num_nodes × 0.80 / dp_size
    # GB200: 600 GB × 2 nodes × 0.80 / 8 = 120 GB per rank
    kv_transfer_config:
      kv_connector: SimpleCPUOffloadConnector
      kv_role: kv_both
      kv_connector_extra_config:
        cpu_bytes_to_use_per_rank: 100000000000
        lazy_offload: false
        enable_cross_layers_blocks: "true"
    env:
      VLLM_USE_V2_MODEL_RUNNER: "1"
      VLLM_USE_RUST_FRONTEND: "1"
      VLLM_SERVER_DEV_MODE: "1"
      VLLM_USE_NCCL_SYMM_MEM: "1"
      VLLM_ENGINE_READY_TIMEOUT_S: "3600"
      VLLM_RPC_TIMEOUT: "600000"
      VLLM_LOG_STATS_INTERVAL: "1"
      VLLM_V2_WARMUP_MAX_NUM_SEQS: "20"
      VLLM_DSV4_MEGA_FP8_COMBINE: "1"
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
      VLLM_PREFIX_CACHE_RETENTION_INTERVAL: "32768"
      VLLM_RANDOMIZE_DP_DUMMY_INPUTS: "1"
      VLLM_USE_DEEP_GEMM: "1"
      TILELANG_CLEANUP_TEMP_FILES: "1"
      DG_JIT_CACHE_DIR: /tmp/dg-cache-dsv4-agentx
      UCX_TLS: rc,cuda_copy
      # New from InferenceX PR #2260
      TORCH_SYMMMEM: "NVSHMEM"
      VLLM_ALLREDUCE_USE_SYMM_MEM: "0"
      UCX_MEMTYPE_CACHE: "n"
      NCCL_CUMEM_ENABLE: "1"
      NCCL_MNNVL_ENABLE: "1"
      NCCL_NVLS_ENABLE: "1"
      VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
    resources:
      ephemeral_storage: 128Gi
    vllm:
      load_format: auto
      trust_remote_code: true
      moe_backend: deep_gemm_amxf4_mega_moe
      gpu_memory_utilization: "0.92"
      kv_cache_dtype: fp8
      block_size: 256
      enable_cumem_allocator: true
      enable_ep_weight_filter: true
      numa_bind: true
      no_disable_hybrid_kv_cache_manager: true
      no_enable_flashinfer_autotune: true
      tokenizer_mode: deepseek_v4
      max_model_len: 1048576
      max_num_seqs: 64
      max_num_batched_tokens: 8192
      max_cudagraph_capture_size: 64
      compilation_config: {cudagraph_mode: FULL_DECODE_ONLY, mode: 0}
      attention_config:
        backend: FLASHINFER_MLA_SPARSE_DSV4
        use_prefill_query_quantization: true
        use_fp4_indexer_cache: true
