# GLM-5.2-FP8 P/D disaggregated base on GB200 NVL72 (oci-gb200): prefill DEP8
# (2x4-GPU nodes) + decode DEP16 (4x4-GPU nodes), 6 nodes / 24 GPU per replica
# pair. Routing follows the same `pd` kind used for dsv4-pro (prefix-cache
# affinity + prefix-cache scoring on the decode pool; see
# manifesto/render/routing.py) -- no model-specific routing plugin needed.
#
# Topology and per-role parallelism directly mirror InferenceX's own
# validated GB200 GLM-5.2 AgentX recipe (SemiAnalysisAI/InferenceX
# benchmarks/multi_node/srt-slurm-recipes/sglang/glm5.2/gb200-fp4/agentic/
# disagg-gb200-2p1d-dep8-dep16-c128-mtp.yaml): prefill tensor/data/expert
# -parallel-size=8 over 2 nodes, decode tensor/data/expert-parallel-size=16
# over 4 nodes, KV transfer over NIXL. That recipe is SGLang+Dynamo on the
# NVFP4 checkpoint; the vLLM flags below instead follow the llm-d
# GLM-5.2-FP8 H200 guide (github.com/llm-d/llm-d
# guides/agentic-serving/glm-5-2-h200.md), which uses the same DEP8/DEP16
# split and NixlConnector.
topology: pd

model:
  id: zai-org/GLM-5.2-FP8
  label: GLM-5.2-FP8
  # See agg-tp-base.yaml note on image_ref / GLM-5.2 vLLM version requirements.
  image_ref: vllm.standard
  served_name: zai-org/GLM-5.2-FP8

routing: {kind: pd, target_role: decode}
runtime: {sidecars: [dcgm-exporter, node-exporter]}

# max_concurrency follows the guide's own derivation (MAX_TOKENS_PER_NODE=32
# * number of decode nodes); mtp_size is the K+1 query-tokens/seq multiplier
# for MTP decode steps (1 = MTP off). Both are shared across roles so the
# decode role's fabric profile (deepep_decode) can compute NVSHMEM_QP_DEPTH
# from max_concurrency -- see clusters/oci-gb200.yaml.
vars:
  max_concurrency: 128
  mtp_size: 1

roles:
  - name: decode
    workload_name: vllm-dep16-decode
    lws: {size: 4, replicas: 1}
    parallelism: {tp: 1, dp: 16, ep: true}
    kv_transfer_config:
      kv_connector: NixlConnector
      kv_role: kv_both
      kv_buffer_device: cuda
      kv_load_failure_policy: fail
    computed:
      env: {MAX_TOKENS: max_concurrency}
      vllm:
        max_num_batched_tokens: max_concurrency * mtp_size
        max_num_seqs: max_concurrency
        max_cudagraph_capture_size: max_concurrency
    env:
      VLLM_HTTP_TIMEOUT_KEEP_ALIVE: "120"
      VLLM_RANDOMIZE_DP_DUMMY_INPUTS: "1"
      VLLM_USE_DEEP_GEMM: "1"
    resources:
      ephemeral_storage: 1Ti
    vllm:
      load_format: auto
      disable_uvicorn_access_log: true
      trust_remote_code: true
      moe_backend: deep_gemm
      all2all_backend: deepep_low_latency
      kv_cache_dtype: fp8
      max_model_len: auto
      disable_access_log_for_endpoints: /health,/metrics
      reasoning_parser: glm45
      tool_call_parser: glm47
      enable_auto_tool_choice: true
      # Guide default 0.95 assumes H200; lowered toward InferenceX's real
      # GB200 DEP16 decode mem-fraction-static (0.85-0.9) as a starting point.
      gpu_memory_utilization: "0.90"

  - name: prefill
    workload_name: vllm-dep8-prefill
    lws: {size: 2, replicas: 1}
    parallelism: {tp: 1, dp: 8, ep: true}
    dp_load_balancing: external
    kv_transfer_config:
      kv_connector: NixlConnector
      kv_role: kv_both
      kv_buffer_device: cuda
      kv_load_failure_policy: fail
    env:
      VLLM_HTTP_TIMEOUT_KEEP_ALIVE: "120"
      VLLM_RANDOMIZE_DP_DUMMY_INPUTS: "1"
      VLLM_USE_DEEP_GEMM: "1"
    resources:
      ephemeral_storage: 1Ti
    vllm:
      load_format: auto
      disable_uvicorn_access_log: true
      trust_remote_code: true
      moe_backend: deep_gemm
      all2all_backend: deepep_high_throughput
      kv_cache_dtype: fp8
      max_model_len: auto
      disable_access_log_for_endpoints: /health,/metrics
      # Guide default 0.935 assumes H200; lowered toward InferenceX's real
      # GB200 DEP8 prefill mem-fraction-static (~0.8) as a starting point.
      gpu_memory_utilization: "0.85"
      max_num_batched_tokens: 2048
