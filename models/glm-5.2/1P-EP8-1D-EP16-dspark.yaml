# 1 prefill DEP8 worker plus 1 decode DEP8 worker, 4 nodes / 16 GPUs, with
# dspark speculative decoding on both roles (3 speculative tokens).
extends: disagg-base.yaml
release: glm-5-2-1p-dep8-1d-dep16-dspark


roles:
  prefill:
    lws: {replicas: 1}
    pre_launch:
      - |
        WORKER=/usr/local/lib/python3.12/dist-packages/vllm/v1/worker/gpu
        PATCH_DIR="$(dirname "$(dirname "$LOG_DIR")")/dspark_patches/v1_worker/gpu"
        for f in \
          dp_utils.py \
          spec_decode/speculator.py \
          spec_decode/dflash/speculator.py \
          spec_decode/autoregressive/speculator.py; do
          test -f "$PATCH_DIR/$f"
        done
        cp "$PATCH_DIR/dp_utils.py" "$WORKER/dp_utils.py"
        cp "$PATCH_DIR/spec_decode/speculator.py" "$WORKER/spec_decode/speculator.py"
        cp "$PATCH_DIR/spec_decode/dflash/speculator.py" "$WORKER/spec_decode/dflash/speculator.py"
        cp "$PATCH_DIR/spec_decode/autoregressive/speculator.py" "$WORKER/spec_decode/autoregressive/speculator.py"
        echo "PR54856 PATCH: installed DEP8 DSpark uniform-batch DP sync reuse from $PATCH_DIR" >&2
    vllm:
      max_num_seqs: 16
      kv_cache_metrics: true
      speculative_config:
        method: dspark
        model: "RedHatAI/GLM-5.2-speculator.dspark"
        num_speculative_tokens: 1
        draft_sample_method: probabilistic
        attention_backend: "FLASH_ATTN"
  decode:
    workload_name: vllm-dep8-decode-dspark
    pre_launch:
      - |
        WORKER=/usr/local/lib/python3.12/dist-packages/vllm/v1/worker/gpu
        PATCH_DIR="$(dirname "$(dirname "$LOG_DIR")")/dspark_patches/v1_worker/gpu"
        for f in \
          dp_utils.py \
          spec_decode/speculator.py \
          spec_decode/dflash/speculator.py \
          spec_decode/autoregressive/speculator.py; do
          test -f "$PATCH_DIR/$f"
        done
        cp "$PATCH_DIR/dp_utils.py" "$WORKER/dp_utils.py"
        cp "$PATCH_DIR/spec_decode/speculator.py" "$WORKER/spec_decode/speculator.py"
        cp "$PATCH_DIR/spec_decode/dflash/speculator.py" "$WORKER/spec_decode/dflash/speculator.py"
        cp "$PATCH_DIR/spec_decode/autoregressive/speculator.py" "$WORKER/spec_decode/autoregressive/speculator.py"
        echo "PR54856 PATCH: installed DEP8 DSpark uniform-batch DP sync reuse from $PATCH_DIR" >&2
    vllm:
      max_num_seqs: 32
      max_num_batched_tokens: 128
      max_cudagraph_capture_size: 128
      speculative_config:
        method: dspark
        model: "RedHatAI/GLM-5.2-speculator.dspark"
        num_speculative_tokens: 5
        draft_sample_method: probabilistic
        enable_adaptive_verification: true
        attention_backend: "FLASH_ATTN"
