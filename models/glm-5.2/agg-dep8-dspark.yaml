# GLM-5.2-FP8 aggregated DEP8 with dspark speculative decoding.
# 2 nodes / 8 GPUs (DP8 + EP).
extends: agg-dep-base.yaml
release: glm-5-2-agg-dep8-dspark

roles:
  decode:
    pre_launch:
      - |
        DIST=/usr/local/lib/python3.12/dist-packages/vllm/distributed/device_communicators
        FUSED=/usr/local/lib/python3.12/dist-packages/vllm/model_executor/layers
        BACKENDS=/usr/local/lib/python3.12/dist-packages/vllm/v1/attention/backends
        MLA=$BACKENDS/mla
        PATCH_DIR="$(dirname "$(dirname "$LOG_DIR")")/dspark_patches"
        for f in flashinfer_all_reduce.py fused_allreduce_gemma_rms_norm.py; do
          test -f "$PATCH_DIR/$f"
        done
        cp "$PATCH_DIR/flashinfer_all_reduce.py" "$DIST/flashinfer_all_reduce.py"
        cp "$PATCH_DIR/fused_allreduce_gemma_rms_norm.py" "$FUSED/fused_allreduce_gemma_rms_norm.py"
        cp "$PATCH_DIR/v1_backends/flashinfer.py" "$BACKENDS/flashinfer.py"
        cp "$PATCH_DIR/v1_backends/flashinfer_mla.py" "$MLA/flashinfer_mla.py"
        cp "$PATCH_DIR/v1_backends/flashinfer_mla_sparse.py" "$MLA/flashinfer_mla_sparse.py"
        echo "DSPARK PATCH: installed allreduce + v1 backend fixes from $PATCH_DIR" >&2
    vllm:
      max_cudagraph_capture_size: 76
      speculative_config:
        method: dspark
        model: "RedHatAI/GLM-5.2-speculator.dspark"
        num_speculative_tokens: 5
        draft_sample_method: probabilistic
        enable_adaptive_verification: true
        attention_backend: "FLASH_ATTN"

