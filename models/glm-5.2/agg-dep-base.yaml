# GLM-5.2-FP8 aggregated DEP8 base on GB200 NVL72 (oci-gb200) — DP attention +
# wide EP MoE across one worker spanning 2x4-GPU nodes. Each DP rank handles
# attention for its own sequences; MoE layers are expert-parallel across all
# 8 ranks via real DeepEP all-to-all. Requires DP-aware routing.
#
# Same 2-node/8-GPU shape as agg-tp-base.yaml, but the InferenceX GB200
# GLM-5.2 AgentX recipes never actually run this arm (their aggregated
# recipe is plain TP8, expert-parallel-size=1) -- these numbers are
# extrapolated from the equivalent deepseek-v4-ix agg-dep8 shape on the same
# cluster/GPU count and need real tuning.
topology: aggregated

model:
  id: RedHatAI/GLM-5.2-NVFP4-FP8
  label: GLM-5.2-NVFP4-FP8
  # OffloadingConnector/TieringOffloadingSpec require a recent vLLM build.
  image_ref: vllm.pinned_nightly_2026-09-01
  # image_ref: vllm.pinned_nightly_2026-08-14-fix

  served_name: RedHatAI/GLM-5.2-NVFP4-FP8

routing: {kind: load_aware, target_role: decode}
runtime: {sidecars: [dcgm-exporter, node-exporter]}

# max_concurrency feeds the deepep_decode fabric profile's NVSHMEM_QP_DEPTH
# computation (clusters/oci-gb200.yaml); kept equal to max_num_seqs below.
vars:
  max_concurrency: 64

roles:
  - name: decode
    workload_name: vllm-dep8-agg
    lws: {size: 2, replicas: 1}
    parallelism: {tp: 1, dp: 8, ep: true}
    dp_load_balancing: external
    fabric_profile: megamoe

    kv_transfer_config:
      kv_connector: OffloadingConnector
      kv_role: kv_both
      kv_connector_extra_config:
        spec_name: TieringOffloadingSpec
        cpu_bytes_to_use: 107374182400  # 100 GiB/rank; 4 ranks/pod = 400 GiB mmap
        eviction_policy: lru
        offload_prompt_only: true
        # self_describing_kv_events: true
        secondary_tiers:
          - type: p2p
            host: "__POD_IP__"
            port: "__P2P_PORT__"
            backends: ["UCX"]
            num_threads: 4
    p2p_config: {port: 7777}
    # 100 GiB/rank x 4 = 400 GiB mmap; 640Gi shm leaves headroom for UCX/NCCL.
    shm_size: 640Gi

    env:
      VLLM_USE_RUST_FRONTEND: "1"
      VLLM_USE_V2_MODEL_RUNNER: "1"
      KV_OFFLOAD_CPU_BYTES: "107374182400"
      VLLM_HTTP_TIMEOUT_KEEP_ALIVE: "120"
      VLLM_RANDOMIZE_DP_DUMMY_INPUTS: "1"
      VLLM_USE_DEEP_GEMM: "1"
      VLLM_USE_NCCL_SYMM_MEM: "1"
      VLLM_ENGINE_READY_TIMEOUT_S: "3600"
      VLLM_RPC_TIMEOUT: "600000"
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
      TILELANG_CLEANUP_TEMP_FILES: "1"
      DG_JIT_CACHE_DIR: /tmp/dg-cache-glm-5-2-fp8-dep
      UCX_TLS: cuda_copy,cuda_ipc,rc
      UCX_CUDA_IPC_ENABLE_MNNVL: "y"
      TILELANG_CLEANUP_TEMP_FILES: "1"
      VLLM_PREFIX_CACHE_RETENTION_INTERVAL: "0"
      # VLLM_LOGGING_LEVEL: "DEBUG"

    resources:
      memory: 800Gi
      ephemeral_storage: 256Gi
    vllm:
      load_format: auto
      disable_uvicorn_access_log: true
      trust_remote_code: true
      enable_cumem_allocator: true
      enable_ep_weight_filter: true
      # moe_backend: deep_gemm
      # all2all_backend: flashinfer_nvlink_one_sided
      all2all_backend: deepep_v2
      kv_cache_dtype: fp8
      max_model_len: auto
      disable_access_log_for_endpoints: /health,/metrics
      reasoning_parser: glm45
      tool_call_parser: glm47
      enable_auto_tool_choice: true
      numa_bind: true
      # Reused from deepseek-v4-ix's own DEP8/2-node aggregated base
      # (same cluster, same GPU count/topology) as a starting point.
      gpu_memory_utilization: "0.87"
      block_size: 64
      max_num_seqs: 64
      max_num_batched_tokens: 8192
      max_cudagraph_capture_size: 64
      compilation_config: {cudagraph_mode: FULL_DECODE_ONLY, mode: 0}
      kv_cache_metrics: true
      kv_cache_metrics_sample: 0.25